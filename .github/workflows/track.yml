name: Snitch tracker

on:
  schedule:
    - cron: "0 * * * *"   # har ghante (UTC). GitHub ise kabhi-kabhi late chalata hai.
  workflow_dispatch:       # Actions tab se manually bhi chala sakte ho

permissions:
  contents: read

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Pichhle run ka state (data/state.db) wapas laao
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: data/state.db
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Run tracker
        run: python tracker.py
        env:
          STORE_URL: ${{ vars.STORE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # State hamesha save karo. Tracker fail hua toh local state commit hi nahi hota (purana hi rehta hai),
      # isliye save karna safe hai. Aur Telegram fail hone pe bhi data ka record sahi rahega.
      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/state.db
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
