name: Snitch tracker

on:
  schedule:
    - cron: "17 * * * *"   # every hour (UTC). GitHub sometimes runs scheduled jobs late.
  workflow_dispatch:       # can also be run manually from the Actions tab

permissions:
  contents: read

concurrency:
  group: tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Restore the previous run's state (data/state.db)
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: data/state.db
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Run tracker
        run: python tracker.py
        env:
          STORE_URL: ${{ vars.STORE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # Always save the state. If the tracker fails, the local state is never committed (the old one remains),
      # so saving is safe. The data record also stays correct when Telegram fails.
      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/state.db
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
